<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} – {{ .Site.Title }}{{ end }}</title>
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ .Permalink }}">
{{ $desc := .Plain | replaceRE "\\s+" " " | truncate 110 }}{{ if $desc }}<meta name="description" content="{{ $desc }}">
<meta property="og:description" content="{{ $desc }}">{{ end }}
{{ $img := "/img/ogp.jpg" }}{{ with .Params.image }}{{ $img = . }}{{ end }}<meta property="og:image" content="{{ $img | absURL }}">
{{ if .IsPage }}<script type="application/ld+json">{{ dict "@context" "https://schema.org" "@type" "BlogPosting" "headline" .Title "mainEntityOfPage" .Permalink "datePublished" (.Date.Format "2006-01-02T15:04:05+09:00") "dateModified" (.Lastmod.Format "2006-01-02T15:04:05+09:00") "image" ($img | absURL) "inLanguage" "ja" "author" (dict "@type" "Person" "@id" "https://www.namigroove.com/#artist" "name" "なみぐる" "url" "https://www.namigroove.com/") "publisher" (dict "@id" "https://www.namigroove.com/#artist") | jsonify | safeJS }}</script>{{ end }}
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#396cdf">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:"MaruMinyaM";src:url("/fonts/x12y12pxMaruMinyaM.woff2") format("woff2");font-display:swap}
{{ readFile "assets_base.css" | safeCSS }}
{{ readFile "assets_post.css" | safeCSS }}
</style>
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
</body>
</html>
