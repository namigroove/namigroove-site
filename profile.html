<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>なみぐる これまでのお仕事</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:"MaruMinyaM";src:url("fonts/x12y12pxMaruMinyaM.woff2") format("woff2");font-display:swap}
/* Layout: トップと同じ海のトークン。見出し+タグの並びだけの控えめな一覧ページ */
:root{
  --paper:#f5f8fe;--ink:#101f45;--ink-soft:#4a5a80;--line:#d5e0f5;
  --sea:#2c5ccc;--wash:#e3ebfb;--coral:#a2511f;--chip:#ffffff;--head:#396cdf;
  --f-display:"MaruMinyaM","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --f-body:"MaruMinyaM","Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --f-mono:"MaruMinyaM","DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0b1430;--ink:#e6ecfb;--ink-soft:#9fb0d6;--line:#22305a;--sea:#7fa3f5;--wash:#142350;--coral:#f0a36b;--chip:#121d40;--head:#396cdf;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b1430;--ink:#e6ecfb;--ink-soft:#9fb0d6;--line:#22305a;--sea:#7fa3f5;--wash:#142350;--coral:#f0a36b;--chip:#121d40;--head:#396cdf;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;font-synthesis:none}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:4px}
header.top{background:var(--head);color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;text-decoration:none;color:#fff;font-family:var(--f-display);font-size:20px}
.logo img{display:block;height:32px;width:auto}
header.top nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--sea);margin:0}
h1,h2{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.25;margin-top:8px}
.intro{padding-block:40px 8px}
.intro p.lead{margin:12px 0 0;color:var(--ink-soft);font-size:14px}
section{padding-block:28px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
h2 small{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font-size:13px;line-height:1.5;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--chip)}
.ranks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ranks li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;border-radius:8px;background:var(--wash);font-size:13px}
.ranks b{font-family:var(--f-mono);font-weight:500;color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
.timeline{list-style:none;margin:0;padding:0}
.timeline>li{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:10px 0;border-bottom:1px dashed var(--line)}
.timeline>li:last-child{border-bottom:0}
.timeline .yr{font-family:var(--f-mono);font-size:14px;color:var(--sea);font-weight:500}
.timeline ul{margin:0;padding-left:1.1em;font-size:14px;line-height:1.8;min-width:0}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);padding-top:2px}
.log a{color:inherit;text-decoration:none;min-width:0}
.log a:hover{color:var(--sea)}
.log .k{font-size:11px;color:var(--sea);margin-right:6px}
footer{padding-block:28px 40px;font-size:12px;color:var(--ink-soft)}
footer a{color:var(--sea)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="https://www.namigroove.com/wp-content/uploads/2021/05/%E5%90%8D%E7%A7%B0%E6%9C%AA%E8%A8%AD%E5%AE%9A-1.png" alt="なみぐる！" width="159" height="32" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>なみぐる！</span></a>
    <nav><a href="index.html#contact">ご依頼</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <p class="eyebrow">WORKS LIST</p>
    <h1>これまでのお仕事</h1>
    <p class="lead">これまでの歩みと、一緒にお仕事させていただいた皆さま、出演させていただいた場所の一覧です。敬称略・順不同。</p>
  </div>

  <section><h2>最近の活動<small>Xの投稿より自動収集</small></h2><ol class="log" id="xlog"></ol></section>
  <section><h2>年表</h2><ol class="timeline" id="timeline"></ol></section>
  <section><h2>企業・レーベル</h2><ul class="tags" id="company"></ul></section>
  <section><h2>音楽ゲーム</h2><ul class="tags" id="game"></ul></section>
  <section><h2>クリエイター</h2><ul class="tags" id="creator"></ul></section>
  <section><h2>出演イベント</h2><ul class="tags" id="stage"></ul></section>
  <section><h2>ボカコレ<small>The VOCALOID Collection</small></h2><ul class="ranks" id="ranks"></ul></section>
</main>

<footer><div class="wrap"><a href="index.html">← トップへ戻る</a></div></footer>

<script>
const LIST = {
  company:["テレビ東京ミュージック","カバー(ホロライブプロダクション)","STPR","バンダイナムコエンターテインメント","ソニー・ミュージック","ビクターエンタテインメント","エイベックス","サントリーホールディングス","日清食品","DIG8 Records","クリプトン・フューチャー・メディア","SSS合同会社","VOICEVOX","VoiSona","MODERNSKY","リットーミュージック","clubasia"],
  game:["プロジェクトセカイ","CHUNITHM","オンゲキ","maimai でらっくす"],
  creator:["をとは","桃寝ちのい","ちょこ","猫宮ひなた","rurudo","夢乃ゆき"],
  stage:["ボカニコ","SNOW MIKU","GOLDDISC","NIGHT HIKE","Electro Swing Party","定禅寺ストリートジャズフェスティバル","ソウル公演","北京公演"],
};
const RANKS = [
  ["2026 冬 REMIX",2],["2025 夏 REMIX",4],["2025 冬 TOP100",3],["2024 冬 TOP100",5],
  ["2023 夏 TOP100",2],["2023 春 ルーキー",2],["2022 秋 ルーキー",4],
];
const TIMELINE = [
  {y:2026, e:["日清焼そばU.F.O. 50周年企画","初音ミク タイ日清食品CM","あおぎり高校 アルバム参加","プロジェクトセカイ 書き下ろし"]},
  {y:2025, e:["プロジェクトセカイほか 書き下ろし","ソウル・北京で海外公演"]},
  {y:2024, e:["maimai でらっくす 収録","マクドナルド CMソング","VOICEVOX 公式テーマ","大空スバル(ホロライブ)楽曲提供"]},
  {y:2023, e:["1st Album「ずんだもんがいっぱい」","プロジェクトセカイ 楽曲"]},
  {y:2022, e:["ずんだもん楽曲が2か月連続でニコニコ殿堂入り","CeVIO AI 双葉湊音 初の公式楽曲"]},
  {y:2021, e:["7月「戻るボタン feat.可不」でボカロPデビュー"]},
];

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
for (const [id, names] of Object.entries(LIST))
  document.getElementById(id).innerHTML = names.map(n=>`<li>${esc(n)}</li>`).join("");
document.getElementById("timeline").innerHTML = TIMELINE.map(t=>`<li><span class="yr">${t.y}</span><ul>${t.e.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></li>`).join("");
fetch("data/x-posts.json").then(r=>r.json()).then(d=>{
  const K={notice:"お知らせ",release:"新曲"};
  document.getElementById("xlog").innerHTML = d.posts.filter(p=>p.type!=="event").map(p=>`<li><time datetime="${p.date}">${p.date.replaceAll("-",".")}</time><a href="https://x.com/namigroove/status/${p.id}" target="_blank" rel="noopener"><span class="k">${K[p.type]}</span>${esc(p.text)}</a></li>`).join("");
}).catch(()=>{});
document.getElementById("ranks").innerHTML = RANKS.map(([e,r])=>`<li><span>${esc(e)}</span><b>${r}位</b></li>`).join("");
</script>
</body>
</html>
