name: YouTubeの新着を作品一覧に追加

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 朝6:17(日本時間)
  workflow_dispatch:         # GitHubの画面から手動でも実行できる

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 新着動画を取り込む
        run: node scripts/sync-youtube.mjs
      - name: 変更があれば保存
        run: |
          if git diff --quiet data/works.json; then
            echo "変更なし"
          else
            git config user.name "namigroove-bot"
            git config user.email "namigroove-bot@users.noreply.github.com"
            git add data/works.json
            git commit -m "YouTubeの新着を作品一覧に追加"
            git push
          fi
