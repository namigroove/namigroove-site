name: 作品一覧を自動更新(YouTube・記事)

on:
  push:
    branches: [main]
    paths: ["blog/content/music/**", "blog/content/movie/**"]
  schedule:
    - cron: "17 21 * * *"   # 毎日 朝6:17(日本時間)
  workflow_dispatch:         # GitHubの画面から手動でも実行できる

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 記事(ミュージック・ムービー)を作品一覧に取り込む
        continue-on-error: true
        run: node scripts/sync-wordpress.mjs
      - name: YouTubeの新着動画を取り込む
        continue-on-error: true
        run: node scripts/sync-youtube.mjs
      - name: Worksページの検索エンジン向け一覧を作り直す
        continue-on-error: true
        run: node scripts/build-works-seo.mjs
      - name: 変更があれば保存
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet data/works.json works.html; then
            echo "変更なし"
          else
            git config user.name "namigroove-bot"
            git config user.email "namigroove-bot@users.noreply.github.com"
            git add data/works.json works.html
            git commit -m "作品一覧を自動更新"
            git push
            # GITHUB_TOKEN での保存では自動公開が走らないので、公開を明示的に起動する
            gh workflow run build-site.yml --ref main
          fi
