name: 追加の画像を取得(migrate-previewへ保存)

# scripts/extra-assets.txt にあるWordPress上の画像を、同じパスで migrate-preview の static/ に保存します。
# WordPress には何も書き込みません。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - uses: actions/checkout@v4
        with: { ref: migrate-preview, path: blog }
      - name: 取得
        run: |
          python3 - <<'PY'
          import os, sys, urllib.request, urllib.parse, time
          HOST = "https://namigroove.moo.jp"   # www.namigroove.com は切り替え後 GitHub を向くため、WordPress側のアドレスから取る
          fail = 0
          for p in [l.strip() for l in open("site/scripts/extra-assets.txt", encoding="utf-8") if l.strip()]:
              dest = "blog/static" + p
              if os.path.exists(dest) and os.path.getsize(dest) > 0:
                  continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              url = HOST + urllib.parse.quote(p)
              for i in range(4):
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read()
                      open(dest, "wb").write(data); print("ok", p, len(data)); break
                  except Exception as e:
                      if i == 3: print("NG", p, e); fail = 1
                      time.sleep(3)
          sys.exit(fail)
          PY
      - name: 保存
        if: always()
        run: |
          cd blog
          git config user.name "namigroove-bot"
          git config user.email "namigroove-bot@users.noreply.github.com"
          git add -A
          git commit -qm "追加の画像を取得" || echo "変更なし"
          git push origin migrate-preview
