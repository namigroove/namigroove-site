name: サイト全体をビルド(静的ページ + Hugoの記事)

# main に保存(Pages CMS での記事の公開を含む)されるたびに、サイト全体を組み立てて公開します。
# 記事(Hugo)は blog/ フォルダ、静的ページはリポジトリ直下です。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "GitHub Pagesに公開する(true/false)"
        default: "true"

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: site, fetch-depth: 0 }
      - name: Hugo を入れる
        run: pip install --quiet hugo && hugo version
      - name: 記事をビルド
        run: hugo --source site/blog --destination "$GITHUB_WORKSPACE/hugo-out" --quiet
      - name: 組み立て(既存の静的ページ + 記事)
        run: |
          mkdir _site
          # 静的ページを、WordPressが出していたURL(/tools/ear/ など)に並べる
          python3 site/scripts/build_pages.py site _site
          # 記事側は、既存のファイルを上書きしない
          rsync -a --ignore-existing hugo-out/ _site/
          touch _site/.nojekyll
      - name: 確認
        run: |
          test -f _site/index.html
          test -f _site/works/index.html
          test -f _site/tools/index.html
          test -f _site/tools/rhythm/index.html
          test -f _site/music/music-10078/index.html
          test -f _site/movie/movie-9826/index.html
          test -f _site/music/works/index.html
          test -f _site/privacy-policy/index.html
          test -f _site/links/index.html
          test -f _site/contact/index.html
          test -f _site/wp-content/uploads/2025/06/big_namigroove_square_banner_gif.gif
          n=$(find _site -name index.html | wc -l); echo "index.html: $n"
          du -sm _site
          [ "$(du -sm _site | cut -f1)" -lt 900 ]
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
